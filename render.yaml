services:
  - type: web
    name: simulator-investasi
    runtime: docker
    plan: free
    region: singapore
    rootDir: "02 Code/Simulator-Investasi"
    dockerfilePath: "./02 Code/Simulator-Investasi/Dockerfile"
    dockerContext: "./02 Code/Simulator-Investasi"
    envVars:
      - key: SIMULATOR_SECRET_KEY
        generateValue: true
      - key: SIMULATOR_AKSES
        sync: false
